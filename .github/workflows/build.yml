name: Build APK with p4a

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev cmake \
            libffi-dev libssl-dev

      - name: Install p4a and Cython
        run: |
          python -m pip install --upgrade pip
          pip install "cython<3.0"
          pip install python-for-android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK
        run: |
          sdkmanager "ndk;25b" "platforms;android-27" "build-tools;27.0.3"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25b" >> $GITHUB_ENV
          echo "ANDROIDNDK=$ANDROID_HOME/ndk/25b" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/25b" >> $GITHUB_ENV

      - name: Build APK
        run: |
          p4a apk \
            --requirements=python3,kivy \
            --private . \
            --package=org.test.calculator \
            --name=Calculator \
            --version=1.0 \
            --bootstrap=sdl2 \
            --arch=arm64-v8a \
            --android-api=27 \
            --ndk-api=21 \
            --ndk-dir=$ANDROID_NDK_HOME \
            --sdk-dir=$ANDROID_HOME

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: calculator-apk
          path: "*.apk"
