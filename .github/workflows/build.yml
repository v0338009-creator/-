name: Build APK with Buildozer Docker

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Кэшируем папку .buildozer, чтобы не качать SDK/NDK каждый раз
      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: .buildozer_global
          key: buildozer-global-${{ hashFiles('buildozer.spec') }}

      - name: Cache local Buildozer directory
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: ${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      - name: Build APK in Docker
        run: |
          docker run --rm \
            -v $PWD:/home/user/hostcwd \
            -v $PWD/.buildozer_global:/home/user/.buildozer_global \
            -v $PWD/.buildozer:/home/user/.buildozer \
            -e APP_ANDROID_ACCEPT_SDK_LICENSE=1 \
            ghcr.io/kivy/buildozer:latest \
            -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: calculator-apk
          path: bin/*.apk
