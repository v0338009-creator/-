name: Build APK with Buildozer Docker

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Шаг 1: Принудительно создаём файлы лицензий для Android SDK.
      # Это обходит интерактивный запрос "Accept? (y/N):", из-за которого
      # Buildozer не может установить build-tools (и, как следствие, aidl).
      - name: Pre-accept Android SDK licenses
        run: |
          mkdir -p .buildozer/android/platform/android-sdk/licenses
          echo -e "\n8933bad161af4178b1185d1a37fbf41ea5269c55" > .buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo -e "\nd56f5187479451eabf01fb78af6dfcb131b33910" > .buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > .buildozer/android/platform/android-sdk/licenses/google-tv-preview-license
          # Также создаём файлы лицензий в глобальной папке .buildozer_global,
          # которую мы монтируем в контейнер, на случай если Buildozer проверяет её
          mkdir -p .buildozer_global/licenses
          echo -e "\n8933bad161af4178b1185d1a37fbf41ea5269c55" > .buildozer_global/licenses/android-sdk-license
          echo -e "\nd56f5187479451eabf01fb78af6dfcb131b33910" > .buildozer_global/licenses/android-sdk-preview-license

      - name: Build APK in Docker
        run: |
          docker run --rm \
            -v $PWD:/home/user/hostcwd \
            -v $PWD/.buildozer_global:/home/user/.buildozer_global \
            -v $PWD/.buildozer:/home/user/.buildozer \
            ghcr.io/kivy/buildozer:latest \
            -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: calculator-apk
          path: bin/*.apk
