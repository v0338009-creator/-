name: Build APK with Buildozer Docker

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build APK in Docker
        run: |
          docker run --rm \
            -v $PWD:/home/user/hostcwd \
            -v $PWD/.buildozer:/home/user/.buildozer \
            ghcr.io/kivy/buildozer:latest \
            -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: calculator-apk
          path: bin/*.apk
